<!DOCTYPE html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Roto Cam</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
/* Layout: an animation desk. The frame sits on a peg bar with the exposure-sheet readout under it; controls sit beside it (below on phones). */
:root {
  --desk: #dfe6dc;
  --cel: #ffffff;
  --ink: #15141c;
  --muted: #55605a;
  --cobalt: #2a35e8;
  --sun: #ffd23f;
  --bubble: #ff8fc7;
  --mint: #5be3b0;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", Consolas, "Courier New", monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
body {
  background: var(--desk);
  background-image: linear-gradient(var(--desk) 1px, transparent 1px), linear-gradient(90deg, rgba(21,20,28,.05) 1px, transparent 1px);
  background-size: 24px 24px;
  color: var(--ink); font-family: var(--display); font-size: 15px; min-height: 100vh;
}
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--cobalt); outline-offset: 2px; }
.wrap {
  max-width: 1120px; margin: 0 auto;
  padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 18px;
}
header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 8px 20px; }
h1 { font-weight: 800; font-size: clamp(34px, 6vw, 56px); line-height: .95; margin: 0; letter-spacing: -.02em; }
h1 span { color: var(--cobalt); }
.sub { margin: 6px 0 0; color: var(--muted); max-width: 52ch; line-height: 1.45; }
.back { font-family: var(--mono); font-size: 13px; color: var(--ink); }

.layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 20px; align-items: start; }

/* the frame on its peg bar */
.stage { min-width: 0; display: grid; gap: 10px; }
.pegbar { display: flex; justify-content: center; gap: 70px; height: 22px; align-items: end; }
.peg { width: 30px; height: 14px; border: 2px solid var(--ink); border-bottom: 0; border-radius: 8px 8px 0 0; background: var(--desk); }
.peg:nth-child(2) { width: 18px; border-radius: 50% 50% 0 0; }
.frame {
  position: relative; background: var(--cel); border: 2px solid var(--ink); border-radius: 6px;
  box-shadow: 8px 8px 0 var(--ink); overflow: hidden;
}
#out { display: block; width: 100%; height: auto; max-width: 100%; }
.tag {
  position: absolute; left: 10px; top: 10px; background: var(--sun); border: 2px solid var(--ink);
  border-radius: 999px; padding: 2px 10px; font-family: var(--mono); font-size: 11.5px; font-weight: 700;
}
.sheet {
  display: flex; flex-wrap: wrap; gap: 6px 18px; font-family: var(--mono); font-size: 12px;
  font-variant-numeric: tabular-nums; color: var(--muted);
}
.sheet b { color: var(--ink); }

/* controls */
.panel {
  background: var(--cel); border: 2px solid var(--ink); border-radius: 12px; box-shadow: 5px 5px 0 var(--ink);
  padding: 16px; display: grid; gap: 16px; min-width: 0;
}
.src { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.btn {
  border: 2px solid var(--ink); border-radius: 9px; background: var(--cel); padding: 9px 10px;
  font-weight: 700; cursor: pointer; text-align: center; box-shadow: 2px 2px 0 var(--ink);
}
.btn:hover { background: var(--sun); }
.btn.primary { background: var(--cobalt); color: var(--cel); }
.btn.primary:hover { background: #1e27c4; }
.btn[aria-pressed="true"] { background: var(--ink); color: var(--cel); }
.btn:disabled { opacity: .4; cursor: default; background: var(--cel); }
label.btn input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.msg {
  margin: 0; font-size: 13.5px; line-height: 1.45; background: #fff6cf; border: 1.5px dashed var(--ink);
  border-radius: 9px; padding: 9px 11px;
}
.group { display: grid; gap: 8px; }
.lbl { font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; }
.lbl output { color: var(--ink); font-weight: 700; letter-spacing: 0; }
.styles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.style { display: flex; align-items: center; gap: 8px; text-align: left; }
.dots { display: flex; flex: none; }
.dots i { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid var(--ink); margin-right: -4px; }
input[type=range] { width: 100%; accent-color: var(--cobalt); }
.toggles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

@media (max-width: 820px) {
  .layout { grid-template-columns: 1fr; }
  .pegbar { gap: 40px; }
}
</style>

<div class="wrap">
  <header>
    <div>
      <h1>Roto<span>Cam</span></h1>
      <p class="sub">Live rotoscoping. Your camera feed gets traced into ink lines and flat cel colors, redrawn every frame like a hand-animated film.</p>
    </div>
    <a class="back" href="../index.html">← Al-Ameen OS</a>
  </header>

  <div class="layout">
    <section class="stage" aria-label="Rotoscoped output">
      <div class="pegbar" aria-hidden="true"><span class="peg"></span><span class="peg"></span><span class="peg"></span></div>
      <div class="frame">
        <canvas id="out" width="640" height="480"></canvas>
        <span class="tag" id="tag">demo scene</span>
      </div>
      <div class="sheet" aria-live="off">
        <span>FR <b id="fr">0000</b></span>
        <span>exposure <b id="exp">on twos</b></span>
        <span>rate <b id="fps">12</b> fps</span>
        <span>trace <b id="res">320×240</b></span>
      </div>
    </section>

    <aside class="panel" aria-label="Controls">
      <div class="src">
        <button class="btn primary" id="cam" type="button">Start camera</button>
        <label class="btn" for="file">Use a video<input id="file" type="file" accept="video/*"></label>
      </div>
      <p class="msg" id="msg" hidden></p>

      <div class="group">
        <span class="lbl">Style</span>
        <div class="styles" id="styles"></div>
      </div>

      <div class="group">
        <label class="lbl" for="levels">Color bands <output id="levelsV">4</output></label>
        <input id="levels" type="range" min="2" max="8" value="4">
      </div>
      <div class="group">
        <label class="lbl" for="ink">Line weight <output id="inkV">55</output></label>
        <input id="ink" type="range" min="0" max="100" value="55">
      </div>
      <div class="group">
        <label class="lbl" for="boilAmt">Line boil <output id="boilV">40</output></label>
        <input id="boilAmt" type="range" min="0" max="100" value="40">
      </div>

      <div class="toggles">
        <button class="btn" id="twos" type="button" aria-pressed="true">On twos</button>
        <button class="btn" id="mirror" type="button" aria-pressed="true">Mirror</button>
        <button class="btn" id="freeze" type="button" aria-pressed="false">Freeze</button>
        <button class="btn" id="stop" type="button" disabled>Stop</button>
      </div>
    </aside>
  </div>
</div>

<!-- kept rendered but off-screen: Safari stops decoding frames of a display:none video -->
<video id="vid" playsinline muted autoplay style="position:fixed;left:-9999px;top:0;width:2px;height:2px;opacity:0;pointer-events:none" aria-hidden="true"></video>

<script>
const $ = s => document.querySelector(s);
const out = $("#out"), octx = out.getContext("2d");
const vid = $("#vid");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* tracing canvas: small on purpose, the upscale softens it into a painted look */
const TW = 320;
let TH = 240;
const src = document.createElement("canvas");
const sctx = src.getContext("2d", { willReadFrequently: true });
let L, B, grain, img;
function size(w, h) {
  TH = Math.round(TW * h / w) || 240;
  src.width = TW; src.height = TH;
  out.width = TW * 2; out.height = TH * 2;
  L = new Float32Array(TW * TH);
  B = new Float32Array(TW * TH * 3);
  grain = new Int8Array(TW * TH).map(() => (Math.random() * 14 - 7) | 0);
  img = sctx.createImageData(TW, TH);
  $("#res").textContent = `${TW}×${TH}`;
}
size(4, 3);

/* ---------- styles ---------- */
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const STYLES = {
  cel:   { name: "Cel",    dots: ["#e8a87c", "#5b8fd1", "#15141c"], paper: null, line: "#15141c" },
  ink:   { name: "Ink",    dots: ["#f6f3ea", "#a9a6a0", "#15141c"], paper: "#f6f3ea", line: "#15141c", tone: ["#15141c", "#7d7a74", "#c9c5bc", "#f6f3ea"] },
  pop:   { name: "Pop",    dots: ["#2a35e8", "#ff8fc7", "#ffd23f"], paper: null, line: "#15141c", tone: ["#1b1a3a", "#2a35e8", "#ff8fc7", "#ffd23f", "#fffbe8"] },
  night: { name: "Neon",   dots: ["#0d0c1a", "#5be3b0", "#ff8fc7"], paper: null, line: "#5be3b0", tone: ["#07060f", "#1a1840", "#3b2a6b", "#6a3f8f"] },
};
for (const s of Object.values(STYLES)) {
  s.lineRGB = hex(s.line);
  if (s.tone) s.toneRGB = s.tone.map(hex);
}
let style = "cel";
$("#styles").innerHTML = Object.entries(STYLES).map(([k, s]) =>
  `<button class="btn style" type="button" data-s="${k}" aria-pressed="${k === style}"><span class="dots">${s.dots.map(c => `<i style="background:${c}"></i>`).join("")}</span>${s.name}</button>`).join("");
$("#styles").addEventListener("click", e => {
  const b = e.target.closest("[data-s]"); if (!b) return;
  style = b.dataset.s;
  document.querySelectorAll("[data-s]").forEach(x => x.setAttribute("aria-pressed", x === b));
});

/* ---------- controls ---------- */
const ctl = { levels: 4, ink: 55, boil: reduce ? 0 : 40, twos: true, mirror: true, freeze: false };
$("#boilAmt").value = ctl.boil; $("#boilV").textContent = ctl.boil;
for (const [id, key] of [["levels", "levels"], ["ink", "ink"], ["boilAmt", "boil"]]) {
  $("#" + id).addEventListener("input", e => { ctl[key] = +e.target.value; $("#" + id.replace("Amt", "") + "V").textContent = e.target.value; });
}
function toggle(id, key, after) {
  $("#" + id).addEventListener("click", e => {
    ctl[key] = !ctl[key]; e.currentTarget.setAttribute("aria-pressed", ctl[key]);
    after && after();
  });
}
toggle("twos", "twos", () => { $("#exp").textContent = ctl.twos ? "on twos" : "on ones"; $("#fps").textContent = ctl.twos ? 12 : 24; });
toggle("mirror", "mirror");
toggle("freeze", "freeze");

/* ---------- sources ---------- */
let mode = "demo", stream = null, fileURL = null;
const msg = t => { $("#msg").textContent = t; $("#msg").hidden = !t; };

async function useVideo(label) {
  mode = "video"; $("#tag").textContent = label; $("#stop").disabled = false;
  try { await vid.play(); }
  catch { msg("The video didn't start. Click Start camera again."); }
}
function stopAll() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null;
  vid.pause(); vid.srcObject = null; vid.removeAttribute("src");
  if (fileURL) URL.revokeObjectURL(fileURL), fileURL = null;
  mode = "demo"; size(4, 3); $("#tag").textContent = "demo scene"; $("#stop").disabled = true;
  $("#cam").textContent = "Start camera";
}

/* front camera first; once it's on, the button flips between front and back (phones) */
let facing = "user", multiCam = false;
const CAM_ERRORS = {
  NotAllowedError: "Camera access is blocked. Click the camera icon in the address bar, choose Allow, then press Start camera again.",
  NotFoundError: "No camera found. Plug one in, or pick a video file instead.",
  NotReadableError: "Another app is using your camera (Zoom, Teams, Discord, the Camera app…). Close it, then press Start camera again.",
  SecurityError: "This page has to be opened over https:// to use the camera.",
};
async function openCamera() {
  const tries = [
    { video: { facingMode: facing, width: { ideal: 640 }, height: { ideal: 480 } }, audio: false },
    { video: true, audio: false }, // fallback for cameras that reject the size or facing hints
  ];
  let last;
  for (const c of tries) {
    try { return await navigator.mediaDevices.getUserMedia(c); }
    catch (err) { last = err; if (err.name === "NotAllowedError" || err.name === "SecurityError") break; }
  }
  throw last;
}
$("#cam").addEventListener("click", async () => {
  if (!window.isSecureContext || !navigator.mediaDevices?.getUserMedia) {
    msg("This browser can't open a camera on this page. Open it over https:// in Chrome, Edge, Firefox or Safari, or pick a video file instead.");
    return;
  }
  if (stream && multiCam) facing = facing === "user" ? "environment" : "user";
  $("#cam").textContent = "Opening…";
  try {
    stopAll();
    stream = await openCamera();
    vid.srcObject = stream; vid.loop = false;
    ctl.mirror = facing === "user"; $("#mirror").setAttribute("aria-pressed", ctl.mirror);
    msg(""); await useVideo("live camera");
    try { multiCam = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === "videoinput").length > 1; } catch {}
    $("#cam").textContent = multiCam ? "Switch camera" : "Restart camera";
  } catch (err) {
    stream = null; $("#cam").textContent = "Start camera";
    msg(CAM_ERRORS[err?.name] || `The camera didn't start (${err?.name || "unknown error"}). Try again, or pick a video file instead.`);
  }
});
$("#file").addEventListener("change", e => {
  const f = e.target.files[0]; if (!f) return;
  stopAll();
  fileURL = URL.createObjectURL(f);
  vid.src = fileURL; vid.loop = true; ctl.mirror = false; $("#mirror").setAttribute("aria-pressed", false);
  msg(""); useVideo(f.name.length > 28 ? f.name.slice(0, 26) + "…" : f.name);
  e.target.value = "";
});
$("#stop").addEventListener("click", () => { stopAll(); msg(""); });

/* ---------- demo scene: something to trace before a source is picked ---------- */
function drawDemo(t) {
  const g = sctx.createLinearGradient(0, 0, 0, TH);
  g.addColorStop(0, "#7fb6ef"); g.addColorStop(1, "#f6d7a8");
  sctx.fillStyle = g; sctx.fillRect(0, 0, TW, TH);
  sctx.fillStyle = "#ffcf4a"; sctx.beginPath(); sctx.arc(TW * .76, TH * .28, 30, 0, 7); sctx.fill();
  const hill = (base, amp, k, ph, col) => {
    sctx.fillStyle = col; sctx.beginPath(); sctx.moveTo(0, TH);
    for (let x = 0; x <= TW; x += 4) sctx.lineTo(x, base + Math.sin(x * k + ph) * amp);
    sctx.lineTo(TW, TH); sctx.fill();
  };
  hill(TH * .62, 14, .018, t * .2, "#6aa86b");
  hill(TH * .78, 10, .03, 1 - t * .35, "#3f7d4f");
  const bx = (t * 60) % (TW + 60) - 30, by = TH * .7 - Math.abs(Math.sin(t * 3)) * 70;
  const rg = sctx.createRadialGradient(bx - 6, by - 6, 2, bx, by, 18);
  rg.addColorStop(0, "#ff9fcb"); rg.addColorStop(1, "#c2306f");
  sctx.fillStyle = rg; sctx.beginPath(); sctx.arc(bx, by, 16, 0, 7); sctx.fill();
}

/* ---------- the trace ---------- */
const GX = 12, GY = 9;
let jit = new Float32Array((GX + 1) * (GY + 1) * 2);
function newBoil() { for (let i = 0; i < jit.length; i++) jit[i] = Math.random() * 2 - 1; }
newBoil();

function trace() {
  const d = sctx.getImageData(0, 0, TW, TH).data;
  const W = TW, H = TH, n = W * H;

  // soften: 3x3 box blur so bands and lines follow shapes, not sensor noise
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    let r = 0, g = 0, b = 0, c = 0;
    for (let j = -1; j <= 1; j++) {
      const yy = y + j; if (yy < 0 || yy >= H) continue;
      for (let i = -1; i <= 1; i++) {
        const xx = x + i; if (xx < 0 || xx >= W) continue;
        const k = (yy * W + xx) * 4; r += d[k]; g += d[k + 1]; b += d[k + 2]; c++;
      }
    }
    const p = y * W + x, q = p * 3;
    B[q] = r / c; B[q + 1] = g / c; B[q + 2] = b / c;
    L[p] = .299 * B[q] + .587 * B[q + 1] + .114 * B[q + 2];
  }

  const S = STYLES[style], o = img.data;
  const lv = ctl.levels, step = 255 / (lv - 1);
  const thr = 150 - ctl.ink * 1.25;           // lower threshold = heavier line
  const amp = ctl.boil / 100 * 1.6;           // how far a line wanders, in trace pixels
  const lr = S.lineRGB;

  for (let y = 0; y < H; y++) {
    const gy = y / (H - 1) * GY, y0 = gy | 0, fy = gy - y0;
    for (let x = 0; x < W; x++) {
      const p = y * W + x, k = p * 4, q = p * 3;
      const l = L[p];

      // fill: flatten luminance into bands, keep the hue
      const band = Math.round(l / step);
      let r, g, b;
      if (S.toneRGB) {
        const t = S.toneRGB, f = band / (lv - 1) * (t.length - 1), a = Math.min(t.length - 2, f | 0), m = f - a;
        r = t[a][0] + (t[a + 1][0] - t[a][0]) * m; g = t[a][1] + (t[a + 1][1] - t[a][1]) * m; b = t[a][2] + (t[a + 1][2] - t[a][2]) * m;
      } else {
        const s = (band * step + 10) / (l + 10);
        const avg = (B[q] + B[q + 1] + B[q + 2]) / 3;
        r = (avg + (B[q] - avg) * 1.35) * s; g = (avg + (B[q + 1] - avg) * 1.35) * s; b = (avg + (B[q + 2] - avg) * 1.35) * s;
        // flatten hue too, like a limited paint palette
        r = Math.round(r / 36) * 36; g = Math.round(g / 36) * 36; b = Math.round(b / 36) * 36;
      }

      // line: sobel edge, sampled at a wobbling offset so the ink "boils"
      let ink = false;
      if (ctl.ink > 0) {
        const gx = x / (W - 1) * GX, x0 = gx | 0, fx = gx - x0;
        const i00 = (y0 * (GX + 1) + x0) * 2, i10 = i00 + 2, i01 = i00 + (GX + 1) * 2, i11 = i01 + 2;
        const lerp2 = c => (jit[i00 + c] * (1 - fx) + jit[Math.min(i10, jit.length - 2) + c] * fx) * (1 - fy)
                         + (jit[Math.min(i01, jit.length - 2) + c] * (1 - fx) + jit[Math.min(i11, jit.length - 2) + c] * fx) * fy;
        const sx = Math.min(W - 2, Math.max(1, Math.round(x + lerp2(0) * amp)));
        const sy = Math.min(H - 2, Math.max(1, Math.round(y + lerp2(1) * amp)));
        const P = sy * W + sx;
        const ex = (L[P - W + 1] + 2 * L[P + 1] + L[P + W + 1]) - (L[P - W - 1] + 2 * L[P - 1] + L[P + W - 1]);
        const ey = (L[P + W - 1] + 2 * L[P + W] + L[P + W + 1]) - (L[P - W - 1] + 2 * L[P - W] + L[P - W + 1]);
        ink = ex * ex + ey * ey > thr * thr;
      }

      if (ink) { r = lr[0]; g = lr[1]; b = lr[2]; }
      const gr = grain[p];
      o[k] = r + gr; o[k + 1] = g + gr; o[k + 2] = b + gr; o[k + 3] = 255;
    }
  }
  sctx.putImageData(img, 0, 0);
  octx.imageSmoothingEnabled = true;
  octx.drawImage(src, 0, 0, out.width, out.height);
}

/* ---------- loop ---------- */
let last = 0, frame = 0, demoT = 0;
function loop(now) {
  requestAnimationFrame(loop);
  const gap = 1000 / (ctl.twos ? 12 : 24);
  if (now - last < gap) return;
  last = now;
  if (ctl.freeze && frame > 0) return;

  if (mode === "demo") {
    if (!reduce) demoT += gap / 1000;
    drawDemo(demoT);
  } else {
    if (vid.readyState < 2 || !vid.videoWidth) return;
    if (Math.round(TW * vid.videoHeight / vid.videoWidth) !== TH) size(vid.videoWidth, vid.videoHeight);
    sctx.save();
    if (ctl.mirror) { sctx.translate(TW, 0); sctx.scale(-1, 1); }
    sctx.drawImage(vid, 0, 0, TW, TH);
    sctx.restore();
  }
  if (ctl.boil > 0) newBoil();
  trace();
  frame++;
  $("#fr").textContent = String(frame % 10000).padStart(4, "0");
}
requestAnimationFrame(loop);
</script>
