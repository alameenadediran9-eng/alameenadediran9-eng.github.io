<!DOCTYPE html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pocket Weather</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800&family=Figtree:wght@400;600&display=swap">
<style>
/* Layout: one column like a phone screen. Verdict first, then the outfit, then the hours that explain it. */
:root {
  --sky: #dff1ff;
  --sky-2: #bfe2ff;
  --card: #ffffff;
  --ink: #0f2233;
  --muted: #4d6577;
  --rain: #2f6bff;
  --warm: #ff7a3d;
  --display: "Unbounded", "Segoe UI", system-ui, sans-serif;
  --body: "Figtree", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --sky: #0c1826; --sky-2: #13263b; --card: #172b40; --ink: #e8f2fb; --muted: #9ab2c6; --rain: #79a3ff; --warm: #ff9a66; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --sky: #0c1826; --sky-2: #13263b; --card: #172b40; --ink: #e8f2fb; --muted: #9ab2c6; --rain: #79a3ff; --warm: #ff9a66; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: linear-gradient(180deg, var(--sky-2), var(--sky) 380px);
  background-color: var(--sky);
  color: var(--ink); font-family: var(--body); font-size: 16px; min-height: 100vh;
}
.wrap {
  max-width: 560px; margin: 0 auto;
  padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 18px;
}
header { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.brand { font-family: var(--display); font-weight: 800; font-size: 15px; letter-spacing: .02em; }
.units { display: flex; border: 1.5px solid var(--ink); border-radius: 999px; overflow: hidden; }
.units button { border: 0; background: none; color: var(--ink); font: 600 13px var(--body); padding: 5px 12px; cursor: pointer; }
.units button[aria-pressed="true"] { background: var(--ink); color: var(--sky); }
form { display: flex; gap: 8px; }
input {
  flex: 1; min-width: 0; font: inherit; color: var(--ink); background: var(--card);
  border: 1.5px solid var(--ink); border-radius: 12px; padding: 10px 14px;
}
.btn { font: 600 15px var(--body); border: 1.5px solid var(--ink); background: var(--ink); color: var(--sky); border-radius: 12px; padding: 10px 16px; cursor: pointer; }
:focus-visible { outline: 3px solid var(--rain); outline-offset: 2px; }
.notice { font-size: 13.5px; color: var(--muted); background: var(--card); border-radius: 10px; padding: 10px 12px; border: 1px dashed var(--muted); }
.place { font-size: 14px; color: var(--muted); margin: 0; }
h1 {
  font-family: var(--display); font-weight: 800; font-size: clamp(30px, 8vw, 44px);
  line-height: 1.08; margin: 4px 0 0; text-wrap: balance; letter-spacing: -.01em;
}
.temps { font-family: var(--display); font-weight: 500; font-size: 15px; color: var(--muted); font-variant-numeric: tabular-nums; }
.outfit { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.outfit li {
  background: var(--card); border-radius: 14px; padding: 12px 14px;
  display: grid; grid-template-columns: 40px 1fr; gap: 12px; align-items: center;
}
.outfit .ic { width: 40px; height: 40px; border-radius: 10px; background: var(--sky-2); display: grid; place-items: center; font-size: 20px; }
.outfit b { display: block; font-weight: 600; }
.outfit span { color: var(--muted); font-size: 14px; }
.label { font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin: 6px 0 -6px; font-weight: 600; }
.hours { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(52px, 1fr); gap: 6px; overflow-x: auto; padding-bottom: 6px; }
.hr { background: var(--card); border-radius: 12px; padding: 10px 4px; display: grid; justify-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
.hr small { font-size: 12px; color: var(--muted); }
.hr b { font-family: var(--display); font-weight: 500; font-size: 15px; }
.bar { width: 8px; height: 46px; border-radius: 4px; background: var(--sky-2); position: relative; overflow: hidden; }
.bar i { position: absolute; left: 0; right: 0; bottom: 0; background: var(--rain); }
.hr .pct { font-size: 11px; color: var(--rain); font-weight: 600; }
footer { font-size: 12.5px; color: var(--muted); }
footer a { color: inherit; }
</style>

<div class="wrap">
  <header>
    <div class="brand">POCKET WEATHER</div>
    <div class="units" role="group" aria-label="Temperature units">
      <button type="button" id="uC" aria-pressed="true">°C</button>
      <button type="button" id="uF" aria-pressed="false">°F</button>
    </div>
  </header>
  <form id="search">
    <input id="city" placeholder="Search a city" aria-label="City" autocomplete="off">
    <button class="btn" type="submit">Go</button>
  </form>
  <div class="notice" id="notice" hidden></div>
  <section aria-live="polite">
    <p class="place" id="place">Loading…</p>
    <h1 id="verdict">Checking the sky…</h1>
    <div class="temps" id="temps"></div>
  </section>
  <p class="label">Wear</p>
  <ul class="outfit" id="outfit"></ul>
  <p class="label">Next 12 hours</p>
  <div class="hours" id="hours"></div>
  <footer>Forecast data from <a href="https://open-meteo.com" target="_blank" rel="noopener">Open-Meteo</a>. Advice uses the "feels like" temperature for the next 12 hours.</footer>
</div>

<script>
const $ = s => document.querySelector(s);
let unit = "C", last = null;
try { unit = localStorage.getItem("pw-unit") || "C"; } catch {}

const fmt = c => unit === "C" ? Math.round(c) + "°" : Math.round(c * 9 / 5 + 32) + "°";

function advise(h) {
  const feels = h.map(x => x.feels), rain = Math.max(...h.map(x => x.rain)), wind = Math.max(...h.map(x => x.wind));
  const lo = Math.min(...feels), hi = Math.max(...feels), mid = (lo + hi) / 2;
  const items = [];
  if (mid < 0) items.push(["🧥", "Heavy coat", "It feels below freezing."], ["🧤", "Hat and gloves", "Your hands will thank you."]);
  else if (mid < 8) items.push(["🧥", "Warm coat", "Cold all day."], ["🧣", "Scarf", "Optional, but nice."]);
  else if (mid < 14) items.push(["🧥", "Jacket", "Cool enough to need one."]);
  else if (mid < 19) items.push(["👕", "Light layer", "A sweater or overshirt you can take off."]);
  else if (mid < 25) items.push(["👕", "T-shirt", "Comfortable most of the day."]);
  else items.push(["🩳", "Shorts and a T-shirt", "It's hot."], ["💧", "Water bottle", "Stay hydrated."]);
  if (hi - lo >= 8) items.push(["🎒", "An extra layer in your bag", `It swings from ${fmt(lo)} to ${fmt(hi)}.`]);
  if (rain >= 50) items.push(["☂️", "Umbrella", `Up to ${rain}% chance of rain.`]);
  else if (rain >= 25) items.push(["🌂", "Small umbrella, just in case", `Up to ${rain}% chance of rain.`]);
  if (wind >= 30) items.push(["💨", "Something windproof", `Gusts around ${Math.round(wind)} km/h.`]);

  const top = items[0][1].toLowerCase();
  let verdict = top[0].toUpperCase() + top.slice(1) + ".";
  verdict += rain >= 50 ? " Bring the umbrella." : rain >= 25 ? " Maybe an umbrella." : " Leave the umbrella.";
  return { items, verdict, lo, hi };
}

function render() {
  if (!last) return;
  const { name, hours } = last;
  const a = advise(hours);
  $("#place").textContent = name;
  $("#verdict").textContent = a.verdict;
  $("#temps").textContent = `Feels like ${fmt(a.lo)} to ${fmt(a.hi)}`;
  $("#outfit").innerHTML = a.items.map(([ic, b, s]) => `<li><div class="ic" aria-hidden="true">${ic}</div><div><b>${b}</b><span>${s}</span></div></li>`).join("");
  $("#hours").innerHTML = hours.map(x => `<div class="hr"><small>${x.time}</small><b>${fmt(x.temp)}</b><div class="bar" title="${x.rain}% rain"><i style="height:${x.rain}%"></i></div><span class="pct">${x.rain}%</span></div>`).join("");
}

function setUnit(u) {
  unit = u;
  $("#uC").setAttribute("aria-pressed", u === "C"); $("#uF").setAttribute("aria-pressed", u === "F");
  try { localStorage.setItem("pw-unit", u); } catch {}
  render();
}
$("#uC").onclick = () => setUnit("C");
$("#uF").onclick = () => setUnit("F");

function sample() {
  const now = new Date(); now.setMinutes(0, 0, 0);
  return { name: "Sample city (example forecast)", hours: Array.from({ length: 12 }, (_, i) => {
    const t = new Date(now.getTime() + i * 3600e3), h = t.getHours();
    const temp = 11 + 5 * Math.sin((h - 9) / 24 * 2 * Math.PI);
    return { time: String(h).padStart(2, "0") + ":00", temp, feels: temp - 2, rain: Math.max(0, Math.round(60 - Math.abs(h - 15) * 12)), wind: 18 };
  }) };
}

async function load(q) {
  $("#place").textContent = "Loading…";
  try {
    const g = await (await fetch(`https://geocoding-api.open-meteo.com/v1/search?count=1&name=${encodeURIComponent(q)}`)).json();
    const p = g.results?.[0];
    if (!p) { $("#notice").hidden = false; $("#notice").textContent = `Couldn't find "${q}". Try a bigger city nearby.`; if (!last) { last = sample(); render(); } else render(); return; }
    const f = await (await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${p.latitude}&longitude=${p.longitude}&hourly=temperature_2m,apparent_temperature,precipitation_probability,wind_speed_10m&forecast_hours=12&timezone=auto`)).json();
    const H = f.hourly;
    last = { name: [p.name, p.admin1, p.country].filter(Boolean).join(", "), hours: H.time.map((t, i) => ({
      time: t.slice(11, 16), temp: H.temperature_2m[i], feels: H.apparent_temperature[i], rain: H.precipitation_probability[i] ?? 0, wind: H.wind_speed_10m[i],
    })) };
    $("#notice").hidden = true;
    try { localStorage.setItem("pw-city", q); } catch {}
  } catch {
    last = sample();
    $("#notice").hidden = false;
    $("#notice").textContent = "Live weather can't load in this preview, so this is an example forecast. When the page is hosted on its own site, searching a city shows the real forecast.";
  }
  render();
}

$("#search").addEventListener("submit", e => { e.preventDefault(); const q = $("#city").value.trim(); if (q) load(q); });
let saved = "London";
try { saved = localStorage.getItem("pw-city") || saved; } catch {}
$("#city").value = saved;
setUnit(unit);
load(saved);
</script>
